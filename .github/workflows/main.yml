name: 🚀 Deploy websites on push
on:
  push:
    branches: [ main ]

jobs:
  compfeedback:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Deploy compfeedback
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: compfeedback.kjsieit.in
          username: compfeedback
          password: ${{ secrets.FTPPASSWORD }}
          protocol: ftps
          port: 21
          passive: true
          exclude: |
            **/.git*
            **/.git*/**
            **/*.xlsx
            Data/**
            kjsitfeedback/settings.py
            passenger_wsgi.py
            **/migrations/**
            **/__pycache__/**

  itfeedback:
    runs-on: ubuntu-latest
    needs: compfeedback
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Deploy itfeedback
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: itfeedback.kjsieit.in
          username: itfeedback
          password: ${{ secrets.FTPPASSWORD }}
          protocol: ftps
          port: 21
          passive: true
          exclude: |
            **/.git*
            **/.git*/**
            **/*.xlsx
            Data/**
            kjsitfeedback/settings.py
            passenger_wsgi.py
            **/migrations/**
            **/__pycache__/**

  extcfeedback:
    runs-on: ubuntu-latest
    needs: itfeedback
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Deploy extcfeedback
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: extcfeedback.kjsieit.in
          username: extcfeedback
          password: ${{ secrets.FTPPASSWORD }}
          protocol: ftps
          port: 21
          passive: true
          exclude: |
            **/.git*
            **/.git*/**
            **/*.xlsx
            Data/**
            kjsitfeedback/settings.py
            passenger_wsgi.py
            **/migrations/**
            **/__pycache__/**
  aidsfeedback:
    runs-on: ubuntu-latest
    needs: extcfeedback
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Deploy aidsfeedback
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: aidsfeedback.kjsieit.in
          username: aidsfeedback
          password: ${{ secrets.FTPPASSWORD }}
          protocol: ftps
          port: 21
          passive: true
          exclude: |
            **/.git*
            **/.git*/**
            **/*.xlsx
            Data/**
            kjsitfeedback/settings.py
            passenger_wsgi.py
            **/migrations/**
            **/__pycache__/**