name: 🚀 Deploy websites on push

on:
  push:
    branches: [ main ]

jobs:
  compfeedback:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Deploy compfeedback (MAIN SOURCE)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: compfeedback.kjsieit.in
          username: studentfeedback
          password: ${{ secrets.FTPPASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /compfeedback.kjsieit.in/
          exclude: |
            **/.git*
            **/__init__.py
            .htaccess
            .python-version
            **/.git*/**
            **/*.xlsx
            Data/**
            kjsitfeedback/settings.py
            passenger_wsgi.py
            **/migrations/**
            **/__pycache__/**
            defaultdata.txt
            .gitignore
            README.md
            uv.lock

  sync_sites:
    runs-on: ubuntu-latest
    needs: compfeedback

    steps:
      - name: 🔁 Sync all sites from compfeedback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: kjsieit.in
          username: t0hmsl01bmmd
          key: ${{ secrets.SSH_KEY }}
          script: |

            echo "🚀 Starting sync from compfeedback..."

            for site in itfeedback.kjsieit.in extcfeedback.kjsieit.in aidsfeedback.kjsieit.in bshfeedback.kjsieit.in; do
              echo "=============================="
              echo "Deploying to $site"
              echo "=============================="

              # 1. Sync code from comp → site
              rsync -av --delete \
              --exclude 'stored_exports/' \
              --exclude 'media/' \
              --exclude 'staticfiles/' \
              --exclude '__pycache__/' \
              --exclude '*.pyc' \
              --exclude '.git/' \
              --exclude '.ftp*' \
              --exclude '.venv/' \
              --exclude 'virtualenv/' \
              --exclude '*/settings.py' \
              /home/t0hmsl01bmmd/public_html/compfeedback.kjsieit.in/ \
              /home/t0hmsl01bmmd/public_html/$site/

              # 2. Activate virtualenv
              cd /home/t0hmsl01bmmd/public_html/$site
              
              export TERM=xterm

              # 3. Run migrations
              /home/t0hmsl01bmmd/virtualenv/public_html/$site/3.10/bin/python manage.py migrate

              # 4. Collect static
              # python manage.py collectstatic --noinput

              # 5. Clean cache + HARD restart (like cPanel)
              
              # remove stale python cache
              find /home/t0hmsl01bmmd/public_html/$site -name "*.pyc" -delete
              find /home/t0hmsl01bmmd/public_html/$site -type d -name "__pycache__" -exec rm -r {} +
              
              # kill old processes (IMPORTANT)
              # pkill -f "passenger" || true
              # pkill -f "python" || true
              
              # restart passenger
              mkdir -p /home/t0hmsl01bmmd/public_html/$site/tmp
              touch /home/t0hmsl01bmmd/public_html/$site/tmp/restart.txt
              echo "✅ Done $site"
              echo ""
            done

            echo "🎯 All sites deployed successfully"



















